<!doctype html>
<html>
<head>
    <title>Dashboard - Phishing Email Detector</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background: #1c1c1c;  /* dark background */
            color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background-color: #2c2c2c; /* darker container */
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
            color: #ffffff;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #555;
            resize: vertical;
            font-size: 14px;
            margin-top: 5px;
            background-color: #1c1c1c;
            color: #f4f4f4;
        }

        input[type="submit"] {
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            padding: 15px;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .green {
            background-color: #145a32;  /* very dark green */
            color: #a3e4d7;             /* bright green text */
            border: 2px solid #0b3d22;
        }

        .yellow {
            background-color: #b7950b;  /* dark golden yellow */
            color: #fff9c4;             /* light yellow text */
            border: 2px solid #7d6608;
        }

        .red {
            background-color: #7b241c;  /* dark red */
            color: #f5b7b1;             /* light red text */
            border: 2px solid #4a140f;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
            textarea {
                font-size: 13px;
            }
            input[type="submit"] {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome, {{ username }}</h2>

        <form method="post">
            <label>Paste Email Content:</label>
            <textarea name="email_content" rows="12" placeholder="Paste the full email here..." required></textarea>
            <input type="submit" value="Analyze">
        </form>

        {% if result %}
        <div class="result {{ result.status }}">
            Score: {{ result.score }} <br>
            {% if result.status == 'green' %}
                Status: Safe
            {% elif result.status == 'yellow' %}
                Status: Suspicious
            {% elif result.status == 'red' %}
                Status: High Risk
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
